<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renzo Fernando Arenas Chipana</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #e8ecf8;
      --muted: #8e9ab8;
      --accent: #5eead4;
      --accent-2: #818cf8;
      --radius: 18px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: 90px; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1b2750 0%, transparent 60%),
                  radial-gradient(900px 500px at 110% 10%, #2a1b4d 0%, transparent 55%),
                  var(--bg);
      color: var(--text);
      line-height: 1.65;
      min-height: 100vh;
    }
    a { color: var(--accent); }

    /* Navegación */
    .nav {
      position: sticky; top: 0; z-index: 20;
      backdrop-filter: blur(12px);
      background: rgba(11,16,32,0.7);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 1100px; margin: auto; padding: 14px 22px;
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; flex-wrap: wrap;
    }
    .brand { font-weight: 800; letter-spacing: 1px; font-size: 1.2rem; }
    .nav-links { display: flex; gap: 6px; flex-wrap: wrap; }
    .nav-links a {
      color: var(--muted); text-decoration: none; font-size: .92rem;
      padding: 6px 12px; border-radius: 999px; transition: .2s;
    }
    .nav-links a:hover { color: var(--text); background: var(--card); }

    /* Portada */
    .hero {
      max-width: 1100px; margin: auto; padding: 110px 22px 90px;
      display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px; align-items: center;
    }
    .tag {
      display: inline-block; padding: 6px 14px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--accent); font-size: .85rem; margin-bottom: 18px;
    }
    .hero h1 { font-size: clamp(2.2rem, 6vw, 3.8rem); line-height: 1.1; margin-bottom: 14px; }
    .hero .role { font-size: 1.2rem; color: var(--muted); margin-bottom: 8px; }
    .hero .location { color: var(--muted); font-size: .95rem; margin-bottom: 26px; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn {
      padding: 12px 24px; border-radius: 12px; text-decoration: none;
      font-weight: 600; transition: transform .2s, box-shadow .2s;
    }
    .btn-primary {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #071026;
    }
    .btn-ghost { border: 1px solid var(--border); color: var(--text); background: var(--card); }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(94,234,212,.2); }
    .avatar {
      width: 100%; max-width: 300px; margin: auto;
      border-radius: 24px; overflow: hidden;
      box-shadow: 0 0 60px rgba(129,140,248,.35);
    }
    .avatar img { width: 100%; height: auto; display: block; }

    /* Secciones */
    main { max-width: 1100px; margin: auto; padding: 0 22px 40px; }
    section { padding: 70px 0; border-top: 1px solid var(--border); }
    .sec-title { margin-bottom: 30px; }
    .sec-title small {
      display: block; color: var(--accent); text-transform: uppercase;
      letter-spacing: 2px; font-size: .78rem; margin-bottom: 6px;
    }
    .sec-title h2 { font-size: 2rem; }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 26px;
      transition: transform .25s, border-color .25s;
    }
    .card:hover { transform: translateY(-4px); border-color: rgba(94,234,212,.35); }

    .grid-2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 22px; }
    .stack > * + * { margin-top: 14px; }

    /* Datos rápidos */
    .facts { display: grid; gap: 12px; }
    .fact { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--border); }
    .fact:last-child { border-bottom: none; }
    .fact .k { color: var(--muted); }
    .fact .v { font-weight: 600; text-align: right; }

    /* Línea de tiempo (formación) */
    .timeline { position: relative; padding-left: 26px; }
    .timeline::before {
      content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px;
      width: 2px; background: linear-gradient(var(--accent), var(--accent-2));
    }
    .tl-item { position: relative; margin-bottom: 22px; }
    .tl-item::before {
      content: ""; position: absolute; left: -26px; top: 6px;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--bg); border: 3px solid var(--accent);
    }
    .tl-item h3 { font-size: 1.05rem; }
    .tl-item p { color: var(--muted); font-size: .95rem; }

    /* Hobbies */
    .skills { display: flex; flex-wrap: wrap; gap: 10px; }
    .skill {
      padding: 8px 16px; border-radius: 999px; font-size: .9rem;
      background: rgba(94,234,212,.08); border: 1px solid rgba(94,234,212,.25);
      color: var(--accent);
    }

    /* Cursos */
    .courses { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    .course h3 { font-size: 1rem; }

    /* Compañeros */
    .peers { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    .peer {
      display: block; padding: 16px 18px; text-decoration: none; color: var(--text);
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      transition: .2s; font-size: .95rem;
    }
    .peer:hover { border-color: var(--accent-2); color: var(--accent); transform: translateY(-3px); }

    /* Contacto */
    .contact { text-align: center; }
    .contact p.lead { color: var(--muted); max-width: 560px; margin: 0 auto 26px; }
    .social { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .quote {
      margin-top: 40px; text-align: center; font-style: italic;
      color: var(--muted); font-size: 1.05rem;
    }

    footer {
      text-align: center; padding: 30px 20px; color: var(--muted);
      font-size: .9rem; border-top: 1px solid var(--border);
    }

    @media (max-width: 800px) {
      .hero { grid-template-columns: 1fr; padding-top: 80px; text-align: center; }
      .actions { justify-content: center; }
      .avatar { order: -1; max-width: 240px; }
      .grid-2 { grid-template-columns: 1fr; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>

<!-- ============================================================
     DISEÑO (no hace falta editar esta parte)
     ============================================================ -->

<nav class="nav">
  <div class="nav-inner">
    <div class="brand" id="brand"></div>
    <div class="nav-links">
      <a href="#sobre">Sobre mí</a>
      <a href="#formacion">Formación</a>
      <a href="#cursos">Cursos</a>
      <a href="#companeros">Compañeros</a>
      <a href="#contacto">Contacto</a>
    </div>
  </div>
</nav>

<header class="hero">
  <div>
    <span class="tag" id="etiqueta"></span>
    <h1 id="nombre"></h1>
    <p class="role" id="rol"></p>
    <p class="location" id="ubicacion"></p>
    <div class="actions">
      <a class="btn btn-primary" href="#sobre">Conóceme</a>
      <a class="btn btn-ghost" href="#contacto">Contacto</a>
    </div>
  </div>
  <div class="avatar" id="avatar"></div>
</header>

<main>

  <section id="sobre">
    <div class="sec-title"><small>01 · Sobre mí</small><h2>Quién soy</h2></div>
    <div class="grid-2">
      <div class="card stack" id="sobre-texto"></div>
      <div class="card facts" id="datos"></div>
    </div>
  </section>

  <section id="formacion">
    <div class="sec-title"><small>02 · Trayectoria</small><h2>Formación</h2></div>
    <div class="grid-2">
      <div class="card"><div class="timeline" id="timeline"></div></div>
      <div class="card">
        <h3 style="margin-bottom:14px" id="titulo-hobbies"></h3>
        <div class="skills" id="hobbies"></div>
      </div>
    </div>
  </section>

  <section id="cursos">
    <div class="sec-title"><small>03 · Académico</small><h2>Cursos</h2></div>
    <div class="courses" id="cursos-lista"></div>
  </section>

  <section id="companeros">
    <div class="sec-title"><small>04 · Comunidad</small><h2>Compañeros</h2></div>
    <div class="peers" id="companeros-lista"></div>
  </section>

  <section id="contacto" class="contact">
    <div class="sec-title"><small>05 · Hablemos</small><h2>Contacto</h2></div>
    <p class="lead">Si quieres conversar, colaborar o simplemente saludar, escríbeme.</p>
    <div class="actions" style="justify-content:center;margin-bottom:24px">
      <a class="btn btn-primary" id="correo" href="#"></a>
    </div>
    <div class="social" id="redes"></div>
    <p class="quote" id="cierre"></p>
  </section>

</main>

<footer id="footer"></footer>

<script>
  // Rellena la página con los datos de arriba
  const $ = id => document.getElementById(id);
  const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  $('brand').textContent = DATOS.marca;
  $('etiqueta').textContent = DATOS.etiqueta;
  $('nombre').textContent = DATOS.nombre;
  $('rol').textContent = DATOS.rol;
  $('ubicacion').textContent = DATOS.ubicacion;

  // Foto: si no hay foto, se oculta el recuadro (no aparece ningún círculo)
  if (DATOS.foto) {
    $('avatar').innerHTML = `<img src="${esc(DATOS.foto)}" alt="${esc(DATOS.nombre)}">`;
  } else {
    $('avatar').style.display = 'none';
  }

  $('sobre-texto').innerHTML = DATOS.sobre_mi.map(p => `<p>${esc(p)}</p>`).join('');
  $('datos').innerHTML = DATOS.datos.map(d =>
    `<div class="fact"><span class="k">${esc(d.k)}</span><span class="v">${esc(d.v)}</span></div>`).join('');

  $('timeline').innerHTML = DATOS.formacion.map(f =>
    `<div class="tl-item"><h3>${esc(f.titulo)}</h3><p>${esc(f.detalle)}</p></div>`).join('');

  $('titulo-hobbies').textContent = DATOS.titulo_hobbies;
  $('hobbies').innerHTML = DATOS.hobbies.map(h =>
    `<span class="skill">${esc(h)}</span>`).join('');

  $('cursos-lista').innerHTML = DATOS.cursos.map(c =>
    `<div class="card course"><h3>${esc(c)}</h3></div>`).join('');

  $('companeros-lista').innerHTML = DATOS.companeros.map(c =>
    `<a class="peer" href="${esc(c.enlace)}" target="_blank" rel="noopener">${esc(c.nombre)}</a>`).join('');

  $('correo').textContent = DATOS.correo;
  $('correo').href = `mailto:${DATOS.correo}`;

  $('redes').innerHTML = DATOS.redes.map(r =>
    `<a class="btn btn-ghost" href="${esc(r.enlace)}" target="_blank" rel="noopener">${esc(r.nombre)}</a>`).join('');

  $('cierre').textContent = DATOS.cierre;
  $('footer').textContent = DATOS.pie;
</script>

</body>
</html>
